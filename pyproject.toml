[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sendesis"
version = "0.1.0"
description = "Qualify AI execution profiles for engineering roles, fail over only to qualified profiles, and gate cross-model review loops."
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format-nongpl]>=4.18",
    "pyyaml>=6",
    "agno==3.0.11",
    "agno-cli-models @ git+https://github.com/Silicon-Wraith/agno-cli-models@v0.1.2",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "reasonhold @ git+https://github.com/Silicon-Wraith/ReasonHold@v0.1.1",
]

[project.scripts]
sendesis = "sendesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration and not local'"
markers = [
    "integration: makes real CLI calls and spends subscription quota; run on purpose only",
    "local: calls a local model over OpenAI-compatible HTTP (Ollama or vLLM); free, run on purpose",
]
