id: vllm-local
enabled: false               # enable after choosing a model
family: set-me               # e.g. qwen, llama, mistral: must differ from anthropic and openai
model:
  class: openai_like
  id: set-me                 # the served model name vLLM reports at /v1/models
  base_url: http://127.0.0.1:8000/v1
timeout_s: 600
notes: >-
  Local tier; used for large N-sample baseline runs in the gate.
