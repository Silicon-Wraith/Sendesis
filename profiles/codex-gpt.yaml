id: codex-gpt
enabled: true
family: openai
runner: codex_cli
model: gpt-5.6-sol          # the default Spike 0 observed; pin it explicitly with -m
reasoning_effort: high
cli:
  binary: codex
  version: "codex-cli 0.155.1"   # exact output of `codex --version`
sandbox: read-only
timeout_s: 300
notes: >-
  Run inside the suite's git-initialized workdir. Pass stdin=DEVNULL.
  The model is confirmed from the stderr header ("model: ..."), since
  --json output does not report it. Needs the bwrap AppArmor profile on
  Ubuntu 24.04 for the sandbox to run commands.
